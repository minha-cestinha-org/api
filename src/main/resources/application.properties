spring.application.name=minhacestinha-api
api.security.token.secret=${JWT_SECRET}

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/minhacestinha}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jpa.show-sql=${SHOW_SQL:false}

spring.messages.basename=messages
spring.messages.encoding=UTF-8

# CORS
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:8081,http://localhost:19006}

# Sefaz (leitura de NFC-e)
sefaz.timeout-ms=${SEFAZ_TIMEOUT_MS:15000}

management.endpoints.web.exposure.include=health,info

# Timezone: America/Sao_Paulo (UTC-3)
spring.jackson.time-zone=America/Sao_Paulo
spring.jpa.properties.hibernate.jdbc.time_zone=America/Sao_Paulo

# Padronização de nomes (opcionais: sem chave, usa a descrição da nota em minúsculo)
ia.api-key=${ANTHROPIC_API_KEY:}
ia.modelo=${IA_MODELO:claude-opus-5-5}
cosmos.token=${COSMOS_TOKEN:}

# E-mail (código de redefinição de senha). Sem MAIL_HOST, o envio só é logado.
spring.mail.host=${MAIL_HOST:}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
management.health.mail.enabled=false
email.remetente=${MAIL_FROM:minhacestinha <nao-responda@minhacestinha.com.br>}
